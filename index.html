<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX PLAYER ADMIN - Panel IPTV Pro</title>
  <meta name="theme-color" content="#08080a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#08080a',
              card: '#121217',
              surface: '#181820',
              border: '#22222e',
              orange: '#ff6600',
              orangeHover: '#ff7b1a',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #08080a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    input, textarea, select { user-select: text; }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between">

  <!-- ================= VISTA LOGIN ================= -->
  <div id="viewAuth" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-brand-card border border-brand-border rounded-3xl p-6 shadow-2xl relative overflow-hidden">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 rounded-2xl bg-brand-orange/10 border border-brand-orange/30 text-brand-orange mb-3">
          <i data-lucide="tv" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black text-white">MAX <span class="text-brand-orange">PLAYER</span></h1>
        <p class="text-[11px] text-gray-400 mt-1 uppercase tracking-widest font-semibold">Administración IPTV & Streaming</p>
      </div>

      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Correo Electrónico</label>
          <input type="email" id="loginEmail" required value="admin@maxplayer.com"
            class="w-full px-3 py-3 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Contraseña</label>
          <input type="password" id="loginPassword" required value="admin123"
            class="w-full px-3 py-3 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
        </div>

        <div class="p-2.5 rounded-xl bg-brand-surface border border-brand-border text-[11px] text-gray-400 flex items-center justify-between">
          <span>Acceso Rápido:</span>
          <span class="text-brand-orange font-mono font-bold">admin123</span>
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-brand-orange hover:bg-brand-orangeHover active:scale-95 font-bold rounded-xl text-white text-xs tracking-wider uppercase transition shadow-lg shadow-brand-orange/20">
          Entrar al Panel
        </button>
      </form>
    </div>
  </div>

  <!-- ================= PANEL PRINCIPAL ================= -->
  <div id="viewMain" class="hidden flex-1 flex flex-col pb-24">
    <!-- Header -->
    <header class="p-4 border-b border-brand-border flex items-center justify-between bg-brand-card/60 backdrop-blur sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-xl bg-brand-orange/10 border border-brand-orange/30 text-brand-orange">
          <i data-lucide="tv" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-sm font-black text-white">MAX <span class="text-brand-orange">PLAYER</span></h1>
          <p id="liveClock" class="text-[10px] text-gray-400 font-mono"></p>
        </div>
      </div>
      <button onclick="logout()" class="p-2 rounded-xl bg-brand-surface text-gray-400 hover:text-white">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </header>

    <main class="p-4 max-w-lg mx-auto w-full space-y-4">
      <!-- Tarjetas de Resumen Dinámicas -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-4">
          <div class="flex justify-between items-start">
            <span class="text-xs text-gray-400 font-medium">Total Clientes</span>
            <i data-lucide="users" class="w-4 h-4 text-brand-orange"></i>
          </div>
          <div id="statTotal" class="text-2xl font-black text-white mt-1">0</div>
          <div id="statActivos" class="text-[10px] text-emerald-400 mt-1">0 activos</div>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-2xl p-4">
          <div class="flex justify-between items-start">
            <span class="text-xs text-gray-400 font-medium">Por Vencer (1-5d)</span>
            <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
          </div>
          <div id="statPorVencer" class="text-2xl font-black text-amber-400 mt-1">0</div>
          <div class="text-[10px] text-gray-400 mt-1">Cobro pendiente</div>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-2xl p-4">
          <div class="flex justify-between items-start">
            <span class="text-xs text-gray-400 font-medium">Cuentas Vencidas</span>
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500"></i>
          </div>
          <div id="statVencidos" class="text-2xl font-black text-white mt-1">0</div>
          <div class="text-[10px] text-rose-400 mt-1">Señal suspendida</div>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-2xl p-4">
          <div class="flex justify-between items-start">
            <span class="text-xs text-gray-400 font-medium">Ingresos Estimados</span>
            <i data-lucide="wallet" class="w-4 h-4 text-emerald-400"></i>
          </div>
          <div id="statCaja" class="text-2xl font-black text-white mt-1">S/ 0.00</div>
          <div class="text-[10px] text-gray-400 mt-1">En soles mensuales</div>
        </div>
      </div>

      <!-- Botón Agregar Nuevo Cliente -->
      <div class="flex gap-2">
        <button onclick="openModal()" class="flex-1 py-3 px-4 bg-brand-orange hover:bg-brand-orangeHover active:scale-98 rounded-2xl font-bold text-xs uppercase tracking-wider text-white flex items-center justify-center gap-2 shadow-lg shadow-brand-orange/20">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Agregar Nuevo Cliente</span>
        </button>
      </div>

      <!-- Buscador -->
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderClients()" placeholder="Buscar cliente por nombre o teléfono..."
          class="w-full pl-10 pr-4 py-2.5 bg-brand-card border border-brand-border rounded-xl text-xs text-white placeholder-gray-500 focus:outline-none focus:border-brand-orange">
        <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-3"></i>
      </div>

      <!-- Lista de Clientes Dinámica -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Gestión de Clientes</p>
          <span id="clientCountBadge" class="text-[10px] text-brand-orange font-bold"></span>
        </div>
        <div id="clientList" class="space-y-2">
          <!-- Render dinámico desde localStorage -->
        </div>
      </div>
    </main>

    <!-- Modal Formulario de Cliente -->
    <div id="clientModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-brand-card border border-brand-border rounded-3xl p-5 shadow-2xl space-y-3">
        <div class="flex justify-between items-center border-b border-brand-border pb-2">
          <h2 id="modalTitle" class="text-sm font-bold text-white">Nuevo Cliente</h2>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form id="clientForm" onsubmit="saveClient(event)" class="space-y-3">
          <input type="hidden" id="clientId">
          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1">Nombre Completo</label>
            <input type="text" id="clientName" required placeholder="Ej: Patricia Valenzuela"
              class="w-full px-3 py-2 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-gray-300 mb-1">WhatsApp</label>
              <input type="tel" id="clientPhone" required placeholder="987654321"
                class="w-full px-3 py-2 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-300 mb-1">Precio (S/)</label>
              <input type="number" id="clientPrice" required value="20"
                class="w-full px-3 py-2 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-gray-300 mb-1">Dispositivo / App</label>
              <input type="text" id="clientDevice" placeholder="TV Box / Smart TV"
                class="w-full px-3 py-2 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-300 mb-1">Fecha Vencimiento</label>
              <input type="date" id="clientDate" required
                class="w-full px-3 py-2 bg-brand-black border border-brand-border rounded-xl text-xs text-white focus:outline-none focus:border-brand-orange">
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="w-1/3 py-2.5 bg-brand-surface rounded-xl text-xs font-semibold text-gray-300">
              Cancelar
            </button>
            <button type="submit" class="w-2/3 py-2.5 bg-brand-orange rounded-xl text-xs font-bold text-white shadow-lg shadow-brand-orange/20">
              Guardar Cliente
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Barra Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 bg-brand-card/95 border-t border-brand-border py-2.5 px-6 flex justify-around items-center backdrop-blur z-40">
      <button onclick="renderClients()" class="flex flex-col items-center text-brand-orange gap-1">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Inicio</span>
      </button>
      <button onclick="openModal()" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
        <span class="text-[10px]">Añadir</span>
      </button>
      <button onclick="alert('Clientes sincronizados y guardados en tu teléfono.')" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i data-lucide="database" class="w-5 h-5"></i>
        <span class="text-[10px]">Datos</span>
      </button>
    </nav>
  </div>

  <script>
    const defaultClients = [
      { id: 1, name: "Patricia Valenzuela", phone: "971822865", device: "TV Box Xiaomi", price: 20, expires: "2026-11-03" },
      { id: 2, name: "Miguel Ángel Torres", phone: "987654321", device: "Smart TV Samsung", price: 20, expires: "2026-11-08" },
      { id: 3, name: "Carlos Mendoza", phone: "991234567", device: "Firestick 4K", price: 20, expires: "2026-11-25" }
    ];

    let clients = JSON.parse(localStorage.getItem('maxplayer_clients')) || defaultClients;

    function saveToStorage() {
      localStorage.setItem('maxplayer_clients', JSON.stringify(clients));
      renderClients();
    }

    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function handleLogin(e) {
      if (e) e.preventDefault();
      document.getElementById('viewAuth').classList.add('hidden');
      document.getElementById('viewMain').classList.remove('hidden');
      renderClients();
      lucide.createIcons();
    }

    function logout() {
      document.getElementById('viewMain').classList.add('hidden');
      document.getElementById('viewAuth').classList.remove('hidden');
    }

    function calculateDays(expireDate) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const exp = new Date(expireDate + 'T00:00:00');
      const diffTime = exp - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function renderClients() {
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const listEl = document.getElementById('clientList');
      if (!listEl) return;

      const filtered = clients.filter(c => c.name.toLowerCase().includes(search) || c.phone.includes(search));

      let total = clients.length;
      let activos = 0;
      let porVencer = 0;
      let vencidos = 0;
      let cajaTotal = 0;

      listEl.innerHTML = '';

      filtered.forEach(c => {
        cajaTotal += Number(c.price || 0);
        const days = calculateDays(c.expires);

        let badgeHtml = '';
        let statusMsg = '';

        if (days < 0) {
          vencidos++;
          badgeHtml = `<span class="px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-400 text-[10px] font-bold">Vencido (${Math.abs(days)}d)</span>`;
          statusMsg = `Hola ${c.name}, le saludamos de MAX PLAYER. Su servicio IPTV ha vencido el ${c.expires}. Puede renovarlo por Yape para restablecer su señal.`;
        } else if (days <= 5) {
          porVencer++;
          badgeHtml = `<span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 text-[10px] font-bold">Vence en ${days}d</span>`;
          statusMsg = `Hola ${c.name}, le saludamos de MAX PLAYER. Su cuenta vencerá en ${days} días (${c.expires}). Le recordamos renovar con anticipación por Yape.`;
        } else {
          activos++;
          badgeHtml = `<span class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 text-[10px] font-bold">Activo (${days}d)</span>`;
          statusMsg = `Hola ${c.name}, le saludamos de MAX PLAYER. Su servicio se encuentra activo hasta el ${c.expires}.`;
        }

        const phoneClean = c.phone.replace(/[^0-9]/g, '');
        const fullPhone = phoneClean.startsWith('51') ? phoneClean : '51' + phoneClean;
        const waLink = `https://wa.me/${fullPhone}?text=${encodeURIComponent(statusMsg)}`;

        const card = document.createElement('div');
        card.className = "bg-brand-card border border-brand-border rounded-2xl p-3.5 space-y-2";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-2">
                <p class="text-xs font-bold text-white">${c.name}</p>
                ${badgeHtml}
              </div>
              <p class="text-[10px] text-gray-400 mt-0.5">${c.device || 'Dispositivo TV'} • S/ ${c.price}.00 • Vence: ${c.expires}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="editClient(${c.id})" class="p-1.5 text-gray-400 hover:text-white rounded-lg bg-brand-surface">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteClient(${c.id})" class="p-1.5 text-rose-400 hover:text-rose-300 rounded-lg bg-brand-surface">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-brand-border/40">
            <button onclick="addOneMonth(${c.id})" class="px-3 py-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl text-[11px] font-bold hover:bg-emerald-500/20 active:scale-95 transition">
              +1 Mes (Renovar)
            </button>
            <a href="${waLink}" target="_blank" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[11px] font-bold flex items-center gap-1.5 shadow-md shadow-emerald-900/30">
              <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
              <span>Enviar WhatsApp</span>
            </a>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActivos').textContent = `${activos} activos`;
      document.getElementById('statPorVencer').textContent = porVencer;
      document.getElementById('statVencidos').textContent = vencidos;
      document.getElementById('statCaja').textContent = `S/ ${cajaTotal.toFixed(2)}`;
      document.getElementById('clientCountBadge').textContent = `${filtered.length} registrados`;

      lucide.createIcons();
    }

    function addOneMonth(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;

      const base = new Date(client.expires + 'T00:00:00');
      base.setMonth(base.getMonth() + 1);
      client.expires = base.toISOString().split('T')[0];
      saveToStorage();
    }

    function deleteClient(id) {
      if (confirm('¿Deseas eliminar este cliente?')) {
        clients = clients.filter(c => c.id !== id);
        saveToStorage();
      }
    }

    function openModal() {
      document.getElementById('clientForm').reset();
      document.getElementById('clientId').value = '';
      document.getElementById('modalTitle').textContent = 'Nuevo Cliente';

      const nextMonth = new Date();
      nextMonth.setMonth(nextMonth.getMonth() + 1);
      document.getElementById('clientDate').value = nextMonth.toISOString().split('T')[0];

      document.getElementById('clientModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('clientModal').classList.add('hidden');
    }

    function editClient(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;

      document.getElementById('clientId').value = client.id;
      document.getElementById('clientName').value = client.name;
      document.getElementById('clientPhone').value = client.phone;
      document.getElementById('clientPrice').value = client.price;
      document.getElementById('clientDevice').value = client.device;
      document.getElementById('clientDate').value = client.expires;
      document.getElementById('modalTitle').textContent = 'Editar Cliente';

      document.getElementById('clientModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function saveClient(e) {
      e.preventDefault();
      const id = document.getElementById('clientId').value;
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      const price = parseFloat(document.getElementById('clientPrice').value) || 20;
      const device = document.getElementById('clientDevice').value.trim() || 'Smart TV';
      const expires = document.getElementById('clientDate').value;

      if (id) {
        const index = clients.findIndex(c => c.id == id);
        if (index !== -1) {
          clients[index] = { id: Number(id), name, phone, price, device, expires };
        }
      } else {
        clients.push({
          id: Date.now(),
          name,
          phone,
          price,
          device,
          expires
        });
      }

      saveToStorage();
      closeModal();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
