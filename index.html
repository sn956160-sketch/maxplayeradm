
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX PLAYER ADMIN - Panel IPTV Pro</title>
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#08080a',
              card: '#121217',
              surface: '#181820',
              border: '#22222e',
              orange: '#ff6600',
              orangeHover: '#ff7b1a',
              orangeDark: '#cc5200',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS para Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #08080a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    input, textarea, select {
      user-select: text;
    }
    .pb-safe-nav {
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a38;
      border-radius: 999px;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between">

  <!-- ================= PANTALLA DE ACCESO (LOGIN) ================= -->
  <div id="viewAuth" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-7 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-36 h-36 bg-brand-orange/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex p-3.5 rounded-2xl bg-brand-orange/10 border border-brand-orange/30 text-brand-orange mb-3 shadow-inner">
          <i data-lucide="tv" class="w-9 h-9"></i>
        </div>
        <h1 class="text-2xl font-black tracking-wider text-white">MAX <span class="text-brand-orange">PLAYER</span></h1>
        <p class="text-[11px] text-gray-400 mt-1 uppercase tracking-widest font-semibold">Administración IPTV & Streaming</p>
      </div>

      <form id="loginForm" class="space-y-4 relative z-10" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">Correo Electrónico</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-gray-500 absolute left-3.5 top-3.5"></i>
            <input type="email" id="loginEmail" required value="admin@maxplayer.com"
              class="w-full pl-10 pr-3 py-3 bg-brand-black border border-brand-border rounded-xl text-xs text-white placeholder-gray-600 focus:outline-none focus:border-brand-orange transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">Contraseña</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-gray-500 absolute left-3.5 top-3.5"></i>
            <input type="password" id="loginPassword" required value="admin123"
              class="w-full pl-10 pr-3 py-3 bg-brand-black border border-brand-border rounded-xl text-xs text-white placeholder-gray-600 focus:outline-none focus:border-brand-orange transition">
          </div>
        </div>

        <div class="p-2.5 rounded-xl bg-brand-surface/70 border border-brand-border/60 text-[11px] text-gray-400 flex items-center justify-between">
          <span>Acceso Rápido Demo:</span>
          <span class="text-brand-orange font-mono font-bold">admin123</span>
        </div>

        <button type="submit" id="loginBtn"
          class="w-full py-3.5 bg-brand-orange hover:bg-brand-orangeHover active:scale-[0.98] font-bold rounded-xl text-white text-xs tracking-wider uppercase transition shadow-lg shadow-brand-orange/20 flex items-center justify-center gap-2">
          <span>Entrar al Panel</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <p id="loginError" class="text-xs text-rose-400 text-center font-medium hidden"></p>
      </form>
    </div>
  </div>

  <!-- ================= APLICACIÓN PRINCIPAL ===============
